<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 90" width="180" height="90">
	<title>Metal shelf container with compartments (top view)</title>
	<style>
		.s0 { fill: #ffffff; stroke: #000000; stroke-width: 2.4 }
		.s1 { fill: none; stroke: #000000; stroke-width: 1.2 }
		.s2 { fill: #000000; stroke: none }
		.s3 { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4 3 }
	</style>
	<!-- Body: back and side walls, open front (bottom edge dashed) -->
	<path class="s0" d="M2 88 V2 H178 V88"/>
	<path class="s3" d="M2 88 H178"/>
	<rect class="s1" x="8" y="8" width="164" height="76"/>
	<!-- Compartment dividers -->
	<path class="s0" d="M62 8 V88 M118 8 V88"/>
	<!-- Laptop on the middle shelf: base + hinge + keyboard area -->
	<rect class="s0" x="70" y="22" width="40" height="52" rx="2"/>
	<path class="s1" d="M70 30 H110"/>
	<rect class="s1" x="74" y="36" width="32" height="20"/>
	<rect class="s1" x="82" y="60" width="16" height="9" rx="1"/>
	<!-- Rivets -->
	<circle class="s2" cx="13" cy="13" r="2"/>
	<circle class="s2" cx="167" cy="13" r="2"/>
	<circle class="s2" cx="13" cy="79" r="2"/>
	<circle class="s2" cx="167" cy="79" r="2"/>
</svg>
